name: Docker image

# Builds the app image and pushes it to GHCR, tagged with the release version.
# CI's release job calls this after semantic-release cuts a version. It can also
# be run by hand for an existing tag, e.g. to publish a release made before this
# workflow existed.
on:
  workflow_call:
    inputs:
      version:
        description: Release version without the leading v, e.g. 1.11.2
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v, e.g. 1.11.2
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Build exactly what was released, not whatever main is now.
          ref: v${{ inputs.version }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=v${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ inputs.version }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
