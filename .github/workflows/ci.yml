name: CI

on:
  push:
    branches: [main]
  pull_request:

# Releases push a commit and a tag; everything else only reads.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: stablature
          POSTGRES_PASSWORD: stablature
          POSTGRES_DB: stablature
          # Byte ordering, so fractional index ranks sort correctly. Matches
          # docker-compose; see src/lib/rank.ts.
          POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stablature -d stablature"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      STABLATURE_DATABASE_URL: postgres://stablature:stablature@localhost:5432/stablature
      BETTER_AUTH_SECRET: ci-secret-not-used-anywhere-real
      BETTER_AUTH_URL: http://localhost:3100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        # Also fails if the SQL schema drifts from the row types.
        run: npm run typecheck

      - run: npm run lint

      - run: npm test

      # Wall-clock budgets (20 ms, 50 ms) cannot share a machine with the parallel run, so they run alone.
      - run: npm run test:budget

      - name: Apply migrations
        # The script uses --env-file-if-exists, so it works here without a
        # .env.local and locally with one.
        run: npm run db:migrate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the full history to work out the next version.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # @semantic-release/npm writes the new version into package.json, so a
      # changed version here means a release was cut.
      - id: before
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - id: after
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

    outputs:
      released: ${{ steps.after.outputs.version != steps.before.outputs.version }}
      version: ${{ steps.after.outputs.version }}

  image:
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
