services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stablature
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stablature}
      POSTGRES_DB: stablature
      # Byte ordering, so fractional index ranks sort correctly if the server
      # ever orders by them. See src/lib/rank.ts.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stablature -d stablature"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      STABLATURE_DATABASE_URL: postgres://stablature:${POSTGRES_PASSWORD:-stablature}@db:5432/stablature
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${APP_URL:-http://localhost:3000}
      STABLATURE_TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
